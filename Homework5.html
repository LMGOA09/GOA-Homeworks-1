    <!-- 1)
        The <video> tag is used to embed video content in an HTML document. 
        It acts as a container for movie clips or plugin-based video streams.

        The <source> tag is a self-closing element used inside media elements 
        like <video> and <audio>. It specifies alternative media files, allowing 
        the browser to choose the most compatible format (e.g., MP4 vs WebM).

        The <audio> tag is used to embed sound content, such as music, podcasts, 
        or other audio streams, directly into a webpage.

        The <select> tag is used to create a drop-down list within a form. 
        It acts as the wrapper for multiple selectable options, allowing users 
        to choose one or more choices.

        The <option> tag defines an individual item or choice within a <select> 
        drop-down menu list.
    -->


    <!-- 2) 
         he 'controls' attribute adds the browser's default playback interface 
        to the media element. This includes the play/pause button, volume control, 
        scrubbing seek bar, and full-screen toggles. Without it, the media is 
        invisible (for audio) or unplayable unless controlled via JavaScript.

        The 'autoplay' attribute instructs the browser to start playing the 
        audio or video automatically as soon as enough data has loaded, without 
        waiting for user interaction. Note: Most modern browsers block autoplay 
        unless the media is also muted.

        The 'muted' attribute forces the audio output of the video or audio 
        element to be turned off by default. It is highly useful for background 
        videos and is often required for the 'autoplay' attribute to work smoothly.

        The 'loop' attribute tells the browser to automatically restart the 
        audio or video from the beginning once it reaches the end, creating a 
        continuous playback cycle.
    -->
