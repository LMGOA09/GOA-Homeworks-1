<!-- 1) 
 Inline CSS means type of CSS that is applied directly to an HTML element using the `style` attribute;
 Internal CSS means type of CSS that is defined within the `<style>` tags in the HTML document;
 External CSS means type of CSS that is defined in a separate `.css` file and linked to the HTML document using the `<link>` tag; 
 
 The pluses of these types of CSS are:
 - Inline CSS: It allows for quick and specific styling of individual elements without affecting other parts of the document. It is useful for testing or when you need to apply a unique style to a single element.
 - Internal CSS: It allows for centralized styling within a single HTML document, making it easier to manage styles for that specific page. It is useful when you want to apply styles that are specific to a single page without affecting other pages.
 - External CSS: It allows for separation of content and presentation, making it easier to maintain and reuse styles across multiple pages. It is useful for larger websites where you want to apply consistent styling across multiple pages and make global changes easily.

 The minuses of these types of CSS are:
    - Inline CSS: It can lead to cluttered HTML code and makes it difficult to maintain and update styles, especially for larger projects. It also has a higher specificity, which can make it harder to override styles.
    - Internal CSS: It can lead to duplication of styles across multiple pages if the same styles are needed on different pages, making it less efficient for larger websites. It also can make the HTML document larger and slower to load.
    - External CSS: It requires an additional HTTP request to load the CSS file, which can slow down the initial page load time. It also can be more complex to set up and manage, especially for smaller projects or when only a few styles are needed.
  -->

 <!-- 2)
  color: This property sets the color of the text content of an element. It can be defined using color names, hexadecimal values, RGB, RGBA, HSL, or HSLA.
  background-color: This property sets the background color of an element. Similar to the color property, it can be defined using color names, hexadecimal values, RGB, RGBA, HSL, or HSLA.
  text-align: This property specifies the horizontal alignment of text within an element. It can take values such as left, right, center, or justify.
  font-size: This property sets the size of the font used for the text content of an element. It can be defined using absolute units (e.g., px, pt) or relative units (e.g., em, rem, %).
