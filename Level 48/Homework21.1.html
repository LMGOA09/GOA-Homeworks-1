<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            width: 400px;
            padding: 15px;
            border: 1px solid #dddddd;
            overflow: hidden;
        }

        .card-img {
            float: right;
            margin: 0 0 10px 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="blog-post-image.png" alt="Sample" class="card-img">
        <h2>Blog Post Title</h2>
        <p>This is the blog post that wraps neatly around the left side of the floated image; adding margin keeps
            appropriate spacing.</p>
    </div>
</body>
</html>
