<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes growText {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.3);
            }
        }

        .grow-title {
            display: intine-block;
            transition: transform 0.3s;
        }

        .grow-title:hover {
            animation: growText 1s forwards;
        }
    </style>
</head>
<body>
    <h1 class="grow-title">Hover over me if you can, bro!</h1>
</body>
</html>
