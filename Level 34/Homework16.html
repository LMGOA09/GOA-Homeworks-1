<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .card {
        position: relative;
        width: 250px;
        padding: 20px;
        border: 1px solid #cccccc;
    }

    .badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: #e63946;
        color: #ffffff;
        padding: 4px 8px;
        border-radius: 4px;
    }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Sale</span>
        <p>Product Card Content</p>
    </div>
</body>
</html>
