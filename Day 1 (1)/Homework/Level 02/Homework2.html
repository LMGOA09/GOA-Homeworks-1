<!-- 1) Explain in comments what the <a></a> tag is used for and give 5 examples of how this tag is used:-->

<!-- The <a> tag defines a hyperlink, which is used to link from one page to another. -->
<!-- The 'href' attribute indicates the link's destination. -->

<!-- 2) Create easy navigation on your site, users should be able to go from your site to the following sites: YouTube,
  Gmail, Sololearn and any Wikipedia. -->
<nav>
  <h3>Quick Navigation</h3>
  <ul>
    <!-- Example 1: Link to YouTube -->
    <li><a href="https://www.youtube.com" target="_blank">Go to YouTube</a></li>

    <!-- Example 2: Link to Gmail -->
    <li><a href="https://mail.google.com" target="_blank">Open Gmail</a></li>

    <!-- Example 3: Link to Sololearn -->
    <li><a href="https://www.sololearn.com/en/learn" target="_blank">Learn on Sololearn</a></li>

    <!-- Example 4: Link to a specific Wikipedia page -->
    <li><a href="https://ka.wikipedia.org/wiki/%E1%83%AA%E1%83%AE%E1%83%94%E1%83%9A%E1%83%98_%E1%83%AB%E1%83%90%E1%83%A6%E1%83%9A%E1%83%98" target="_blank">Visit Wikipedia</a></li>
  </ul>
</nav>
