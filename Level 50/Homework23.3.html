<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .article-content {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
        }

        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
            }

            .site-header,
            .site-footer {
                display: none !important;
            }

            .article-content {
                background: none !important;
                color: #000000 !important;
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">Site Navigation</header>
    <main class="article-content">
        <h1>Article Title's Here</h1>
        <p>This is colorful content optimized for dark mode on screen, but clean and B&W on paper!</p>
    </main>
    <footer class="site-footer">Site Footer's on sight! &copy; 2026, All rights reserved.</footer>
</body>
</html>
