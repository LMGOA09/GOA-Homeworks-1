<!-- 
display: grid: This turns any normal HTML container (like a <div>) into a Grid Container. Once you turn this on, all direct 
children inside it become grid items that you can arrange in rows and columns.

grid-template-columns: This tells the browser how many vertical columns to create and how wide each column should be.
Example: grid-template-columns: repeat(3, 1fr); creates 3 equal-sized columns. (1fr means "one fraction of the available space").

grid-template-rows: This tells the browser how many horizontal rows to create and how tall each row should be.
Example: grid-template-rows: 100px 200px; creates two rows—the first one is 100 pixels tall, and the second is 200 pixels tall. -->

<!-- #2) -->
<!--
Properties of display: flex:
1. One-Dimensional (handles items in a single row OR a single column at a time);
2. Aligning items in a single line (like a navigation bar, a row of buttons, or centering a single box);
3. Items wrap naturally based on their size, but you don't explicitly control rows and columns together.

Properties of display: grid:
1. Two-Dimensional (handles items in both rows AND columns at the exact same time);
2. Designing the overall layout of an entire page, product grids, photo galleries, or complex dashboards;
3. We explicitly design the columns and rows, and we can place items into specific cells.
-->
