<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            align-items: center;
            height: 200px;
            background-color: #ecf0f1;
            gap: 10px;
        }

        .box {
            width: 80px;
            height: 80px;
            background-color: #1abc9c;
        }

        .items-2 {
            align-self: flex-end;
            background-color: #e67e22;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box item-2">2</div>
        <div class="box">3</div>
    </div>
</body>
</html>
