<!-- :link: Targets links (<a> tags) that have not yet been visited by the user. It is the default state of an unclicked hyperlink.

:visited: Targets links (<a> tags) that the user has already clicked/visited in their browser history. For security reasons, 
 browsers restrict the styles you can change here (mostly limited to color and background-color).

:hover: Triggers when the user moves their mouse pointer over an element. It works on almost any element (buttons, links, divs, 
 table rows) and is crucial for creating intuitive, interactive UI.

:active: Triggers during the exact moment an element is being clicked or activated by the user (the mouse button is held down).

:disabled: Targets any HTML form element (like <button>, <input>, or <textarea>) that currently has the disabled attribute, 
 allowing you to make them look unclickable or grayed out.

:nth-child(): A structural pseudo-class that selects elements based on their position/index within a parent container. It accepts 
 numbers (:nth-child(2)), keywords (:nth-child(odd), :nth-child(even)), or functional formulas like :nth-child(3n+1) -->
