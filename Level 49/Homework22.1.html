<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes Chameleon {
            0% {
                background-color: #0000ff;
            }
            50% {
                background-color: #ff0000;
            }
            100% {
                background-color: #0000ff;
            }
        }

        .chameleon-box {
            width: 100px;
            height: 100px;
            animation: Chameleon 3s infinite;
        }
    </style>
</head>
<body>
    <div class="chameleon-box"></div>
</body>
</html>
